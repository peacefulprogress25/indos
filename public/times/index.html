<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indos Times — AI in India, in rupees</title>
<meta name="description" content="The Indos Times: a live, rolling newspaper of AI in India — sovereign models, policy, token economics, compute. Updated every 8 hours. By Indos.">
<style>
:root { --ink:#161616; --paper:#f2efe6; --card:#efece2; --orange:#FF6B00; --grey:#666; --faint:#8a8578; }
* { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font-family:Georgia,'Times New Roman',serif; }
.wrap { max-width:1240px; margin:0 auto; padding:22px 26px 30px; }
/* masthead */
.mast { text-align:center; border-top:3px double var(--ink); border-bottom:3px double var(--ink); padding:14px 0 10px; }
.mast h1 { font-family:'Old English Text MT','UnifrakturMaguntia','Blackletter',serif; font-size:64px; margin:0; line-height:.95; }
.mast .tag { font-size:13px; letter-spacing:4px; text-transform:uppercase; color:var(--orange); font-weight:bold; font-family:Arial Narrow,Arial,sans-serif; border-bottom:1px solid var(--orange); display:inline-block; padding:2px 18px 6px; margin-top:4px; }
.dateline { display:flex; justify-content:space-between; align-items:center; font-family:Arial Narrow,Arial,sans-serif; font-size:11.5px; text-transform:uppercase; letter-spacing:1px; border-bottom:1px solid var(--ink); padding:5px 2px; margin-top:6px; }
.dateline .site { color:var(--orange); font-weight:bold; }
.live { display:inline-flex; align-items:center; gap:6px; color:#333; }
.live .dot { width:8px; height:8px; border-radius:50%; background:var(--orange); animation:pulse 1.6s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
.toolbar { display:flex; justify-content:space-between; align-items:center; margin:14px 0 4px; font-family:Arial Narrow,Arial,sans-serif; font-size:12px; text-transform:uppercase; letter-spacing:1px; }
.toolbar select, .toolbar button { background:var(--card); border:1px solid var(--ink); font:inherit; letter-spacing:1px; padding:4px 8px; cursor:pointer; color:var(--ink); }
.toolbar button:hover { background:var(--orange); color:#fff; }
/* lead */
.lead { margin:14px 0 16px; border-bottom:2px solid var(--ink); padding-bottom:14px; cursor:pointer; }
.lead .kicker { font-family:Arial Narrow,Arial,sans-serif; font-size:12px; text-transform:uppercase; letter-spacing:2px; color:var(--orange); font-weight:bold; }
.lead h2 { font-size:38px; line-height:1.05; margin:4px 0 6px; }
.lead .dek { font-size:17px; font-style:italic; color:#333; margin:0 0 10px; }
.lead .photo { width:100%; border:1px solid #999; }
.lead .photo img { width:100%; display:block; filter:grayscale(1) contrast(1.05); }
.lead .meta { font-family:Arial Narrow,Arial,sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--grey); margin-top:8px; }
.lead:hover h2 { color:var(--orange); }
/* columns of stories */
.cols { column-count:3; column-gap:22px; column-rule:1px solid #c9c4b6; }
.story { break-inside:avoid; margin-bottom:16px; cursor:pointer; }
.story .kicker { font-family:Arial Narrow,Arial,sans-serif; font-size:10.5px; text-transform:uppercase; letter-spacing:1.8px; color:var(--orange); font-weight:bold; }
.story h3 { font-size:20px; line-height:1.1; margin:3px 0 5px; }
.story p { font-size:12px; line-height:1.42; margin:0 0 4px; color:#222; }
.story img.thumb { width:100%; height:96px; object-fit:cover; filter:grayscale(1) contrast(1.05); border:1px solid #999; margin-bottom:7px; display:block; }
.story .more { font-family:Arial Narrow,Arial,sans-serif; font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:var(--orange); font-weight:bold; }
.story:hover h3 { color:var(--orange); }
/* quote of the day */
.quote { margin:16px 0; border-top:3px double var(--ink); border-bottom:3px double var(--ink); padding:16px 26px; text-align:center; background:var(--card); }
.quote .mark { font-size:52px; line-height:0; color:var(--orange); font-family:Georgia,serif; }
.quote .text { font-size:24px; font-style:italic; line-height:1.35; margin:6px 0 8px; }
.quote .attr { font-family:Arial Narrow,Arial,sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:var(--grey); }
.quote .attr a { color:var(--orange); font-weight:bold; text-decoration:none; }
/* indos pov box */
.pov { margin-top:18px; border-top:3px solid var(--orange); background:var(--card); padding:12px 16px; }
.pov .lab { font-family:Arial Narrow,Arial,sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:2px; color:var(--orange); font-weight:bold; margin-bottom:5px; }
.pov p { font-size:13.5px; font-style:italic; line-height:1.5; margin:0; color:#222; }
/* strips */
.strip { margin:18px 0 0; border-top:3px solid var(--orange); border-left:1.5px solid var(--ink); border-right:1.5px solid var(--ink); border-bottom:1.5px solid var(--ink); background:var(--card); }
.strip h4 { font-family:Arial Narrow,Arial,sans-serif; font-size:12px; text-transform:uppercase; letter-spacing:2px; margin:0; padding:8px 12px 0; }
.strip .body { padding:6px 12px 12px; font-size:11.5px; }
.brief-table { width:100%; border-collapse:collapse; font-size:10.5px; }
.brief-table td { padding:2.5px 4px; border-bottom:1px dotted #c9c4b6; }
.brief-table td:last-child, .brief-table td:nth-last-child(2){ text-align:right; white-space:nowrap; }
.forecast { display:flex; gap:10px; margin-top:14px; }
.fday { flex:1; border-top:3px solid var(--orange); border-left:1px solid var(--ink); border-right:1px solid var(--ink); border-bottom:1px solid var(--ink); background:var(--card); padding:8px 10px; }
.fday .d { font-family:Arial Narrow,Arial,sans-serif; font-size:10px; text-transform:uppercase; letter-spacing:1.5px; color:var(--orange); font-weight:bold; }
.fday .t { font-size:12.5px; font-weight:bold; margin:2px 0 3px; }
.fday .s { font-size:10px; }
/* detail overlay */
.overlay { position:fixed; inset:0; background:rgba(10,10,8,.72); display:none; overflow-y:auto; z-index:50; }
.overlay.open { display:block; }
.article { max-width:860px; margin:4vh auto; background:var(--paper); padding:34px 44px 30px; border-top:3px double var(--ink); border-bottom:3px double var(--ink); }
.article .kicker { font-family:Arial Narrow,Arial,sans-serif; font-size:12px; text-transform:uppercase; letter-spacing:2px; color:var(--orange); font-weight:bold; }
.article h2 { font-size:34px; line-height:1.08; margin:6px 0 8px; }
.article .dek { font-style:italic; font-size:16px; color:#333; margin:0 0 10px; }
.article .meta { font-family:Arial Narrow,Arial,sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--grey); margin-bottom:14px; border-bottom:1px solid #c9c4b6; padding-bottom:10px; }
.article p { font-size:15px; line-height:1.55; margin:0 0 12px; text-align:justify; }
.article .srcs { border-top:2px solid var(--ink); margin-top:18px; padding-top:10px; font-size:12px; }
.article .srcs a { color:var(--ink); }
.article .share { margin-top:14px; display:flex; gap:10px; }
.article .share a { font-family:Arial Narrow,Arial,sans-serif; text-transform:uppercase; letter-spacing:1px; font-size:11px; color:#fff; background:var(--ink); padding:6px 12px; text-decoration:none; }
.article .close { position:sticky; top:0; float:right; font-size:26px; cursor:pointer; background:none; border:none; }
/* footer */
.footer { margin-top:26px; border-top:3px double var(--ink); padding-top:8px; display:flex; justify-content:space-between; font-family:Arial Narrow,Arial,sans-serif; font-size:10.5px; letter-spacing:.5px; color:var(--grey); text-transform:uppercase; }
@media (max-width:900px){ .cols{column-count:1} .forecast{flex-direction:column} .lead h2{font-size:28px} }
</style>
</head>
<body>
<div class="wrap">
  <div class="mast">
    <h1>Indos Times</h1>
    <div class="tag">Intelligence flows, civilization grows</div>
    <div class="dateline">
      <span class="live"><span class="dot"></span><span id="d-updated">Updating…</span></span>
      <span id="d-edition"></span>
      <span class="site">indos.tech/times</span>
    </div>
  </div>

  <div class="toolbar">
    <span>Rolling edition — stories refresh as they emerge</span>
    <span>
      <select id="editionSel" onchange="loadEdition(this.value)"></select>
      <button onclick="toggleBrief()">Market Brief ▾</button>
    </span>
  </div>

  <div id="lead"></div>
  <div id="qotd"></div>
  <div id="cols" class="cols"></div>
  <div id="briefWrap" class="strip" style="display:none"></div>
  <div id="forecast" class="forecast"></div>
  <div class="footer"><span>Generated by an autonomous agent for Indos</span><span>Every figure cited · indos.tech</span></div>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeStory()">
  <div class="article" id="article"></div>
</div>

<script src="data.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
let CURRENT = null;

function render(issue){
  const m = issue.meta, lead = issue.lead;
  document.title = m.name + ' — AI in India, in rupees';
  $('#d-updated').textContent = m.date + ' · ' + m.edition;
  $('#d-edition').textContent = 'Updated ' + m.cadence || 'every 8 hours';
  // lead
  $('#lead').innerHTML = `
    <div class="lead" onclick="openStory('${lead.slug}')">
      <div class="kicker">${esc(lead.kicker)}</div>
      <h2>${esc(lead.headline)}</h2>
      <div class="dek">${esc(lead.dek)}</div>
      <div class="photo"><img src="${lead.image}" alt=""><div class="meta">${esc(lead.dateline)} · By ${esc(lead.byline)} · Read the story →</div></div>
    </div>`;
  // quote of the day
  const q = (issue.quotes && issue.quotes[0]) || null;
  document.getElementById('qotd').innerHTML = q ? `
    <div class="quote">
      <div class="mark">“</div>
      <div class="text">${esc(q.quote)}</div>
      <div class="attr">— ${esc(q.by)} · ${esc(q.context)} · <a href="${esc(q.url)}" target="_blank" rel="noopener">${esc(q.source)}</a></div>
    </div>` : '';
  // columns
  $('#cols').innerHTML = issue.stories.map(st => `
    <div class="story" onclick="openStory('${st.slug}')">
      ${st.image ? `<img class="thumb" src="${st.image}" alt="">` : ''}
      <div class="kicker">${esc(st.kicker)}</div>
      <h3>${esc(st.headline)}</h3>
      <p>${esc(st.lede)}</p>
      <span class="more">Read in detail →</span>
    </div>`).join('');
  // brief
  const models = issue.market_brief.models;
  const half = Math.ceil(models.length/2);
  const table = c => '<table class="brief-table"><tr><td style="font-size:9px;color:#888">Model</td><td style="font-size:9px;color:#888">In</td><td style="font-size:9px;color:#888">Out</td></tr>' +
    c.map(x=>`<tr><td>${esc(x.name)} <span style="color:#888;font-size:9px">· ${esc(x.tier)}</span></td><td>₹${esc(x.input)}</td><td>${x.output==='—'?'—':'₹'+esc(x.output)}</td></tr>`).join('') + '</table>';
  $('#briefWrap').innerHTML = `<h4>${esc(issue.market_brief.title)}</h4><div class="body" style="display:flex;gap:20px">${table(models.slice(0,half))}${table(models.slice(half))}</div>`;
  // forecast
  $('#forecast').innerHTML = issue.forecast.map(d=>`
    <div class="fday"><div class="d">${esc(d.day)}</div><div class="t">${esc(d.title)}</div><div class="s">${esc(d.text)}</div></div>`).join('');
  CURRENT = issue;
}

function openStory(slug){
  const issue = CURRENT;
  let st = issue.stories.find(s=>s.slug===slug);
  let isLead = issue.lead.slug===slug;
  const data = isLead ? issue.lead : st;
  $('#article').innerHTML = `
    <button class="close" onclick="closeStory()">×</button>
    <div class="kicker">${esc(data.kicker)}</div>
    <h2>${esc(data.headline)}</h2>
    <div class="dek">${esc(data.dek)}</div>
    <div class="meta">By ${esc(data.byline)} · ${esc(data.dateline)} · ${esc(issue.meta.date)}</div>
    ${data.image ? `<img src="${data.image}" style="width:100%;filter:grayscale(1) contrast(1.05);border:1px solid #999;margin-bottom:12px" alt="">` : ''}
    ${data.body_long ? data.body_long.map(p=>`<p>${esc(p)}</p>`).join('') : data.body.map(p=>`<p>${esc(p)}</p>`).join('')}
    <div class="srcs"><strong>Sources</strong><br>${data.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join(' · ')}</div>
    ${data.indos_pov && data.indos_pov.length ? `<div class="pov"><div class="lab">Indos POV</div>${data.indos_pov.map(p=>`<p>${esc(p)}</p>`).join('')}</div>` : ''}
    <div class="share">
      <a href="https://twitter.com/intent/tweet?text=${encodeURIComponent(data.headline + ' — Indos Times')}&url=${encodeURIComponent(location.href)}" target="_blank">Share on X</a>
      <a href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(location.href)}" target="_blank">Share on LinkedIn</a>
    </div>`;
  $('#overlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeStory(){ $('#overlay').classList.remove('open'); document.body.style.overflow=''; }
function toggleBrief(){ const b=$('#briefWrap'); b.style.display = b.style.display==='none' ? 'block' : 'none'; }
function loadEdition(slug){ const e = window.TIMES_ARCHIVE.find(x=>x.meta.date_slug===slug); if(e){ render(e); history.replaceState(null,'','#'+slug); } }
function init(){
  const slug = (location.hash||'#latest').slice(1);
  const e = slug!=='latest' ? window.TIMES_ARCHIVE.find(x=>x.meta.date_slug===slug) : window.TIMES_ARCHIVE[0];
  if(!e) return;
  render(e);
  $('#editionSel').innerHTML = window.TIMES_ARCHIVE.map(x=>`<option value="${x.meta.date_slug}" ${x===e?'selected':''}>${x.meta.date}</option>`).join('');
}
init();
</script>
</body>
</html>
